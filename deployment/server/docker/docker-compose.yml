# Vord Fleet — self-hosted Docker Compose deployment
# Copy .env.example to .env and fill in all values before running.
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - vord-fleet

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - vord-fleet

  migration-runner:
    image: ghcr.io/framlux/vord/migration_runner:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__HOSTNAME: postgres
      Database__USER: ${DB_USER}
      Database__PASSWORD: ${DB_PASSWORD}
      Database__DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - vord-fleet

  api-server:
    image: ghcr.io/framlux/vord/api-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration-runner:
        condition: service_healthy
    ports:
      - "${API_HTTP_PORT:-12233}:12233"
      - "${API_GRPC_PORT:-12234}:12234"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Set ForwardedHeaders__KnownNetworks__0 to the real proxy/pod CIDR that fronts this service
      # (required in Production). X-Forwarded-Host is NOT trusted by default; only set
      # ForwardedHeaders__AllowForwardedHost=true if the proxy is known to rewrite the Host header.
      Database__HOSTNAME: postgres
      Database__USER: ${DB_USER}
      Database__PASSWORD: ${DB_PASSWORD}
      Database__DB: ${DB_NAME}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      Cors__Origins__0: ${CORS_ORIGIN:-https://vordfleet.dev}
      App__BaseUrl: ${APP_BASE_URL:-https://vordfleet.dev}
      Authentication__GitHub__ClientId: ${GITHUB_CLIENT_ID}
      Authentication__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      Authentication__Microsoft__ClientId: ${MICROSOFT_CLIENT_ID}
      Authentication__Microsoft__ClientSecret: ${MICROSOFT_CLIENT_SECRET}
      Authentication__Oidc__Authority: ${OIDC_AUTHORITY:-}
      Authentication__Oidc__ClientId: ${OIDC_CLIENT_ID:-}
      Authentication__Oidc__ClientSecret: ${OIDC_CLIENT_SECRET:-}
      Authentication__Oidc__MetadataAddress: ${OIDC_METADATA_ADDRESS:-}
      # This compose file is the reference self-hosted deployment. Leave this true — setting it
      # false requires a reachable billing API, which is not part of the self-hosted product.
      Deployment__SelfHosted: "true"
      # Email is optional. Leave SMTP_HOST empty and every send is skipped; set it to a relay
      # (Postfix, a provider's submission endpoint) and invitations and alerts are delivered.
      Email__FromEmail: ${EMAIL_FROM:-}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: "${SMTP_PORT:-587}"
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__UseStartTls: "${SMTP_USE_STARTTLS:-true}"
      # Auth__CookieDomain: "${AUTH_COOKIE_DOMAIN:-}"  # Uncomment if using a custom domain
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:12233/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - vord-fleet

  services-worker:
    # Processes Hangfire recurring jobs (alert evaluation, data export, partition management,
    # Stripe sync, usage heartbeat, health sweep, etc.). The api-server enqueues; this worker
    # drains. Without this service the dashboard will show scheduled jobs but nothing executes.
    image: ghcr.io/framlux/vord/services-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration-runner:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Database__HOSTNAME: postgres
      Database__USER: ${DB_USER}
      Database__PASSWORD: ${DB_PASSWORD}
      Database__DB: ${DB_NAME}
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      # This compose file is the reference self-hosted deployment. Leave this true — setting it
      # false requires a reachable billing API, which is not part of the self-hosted product.
      Deployment__SelfHosted: "true"
      Hangfire__WorkerCount: "${HANGFIRE_WORKER_COUNT:-10}"
      # Email is optional. Leave SMTP_HOST empty and every send is skipped; set it to a relay
      # (Postfix, a provider's submission endpoint) and invitations and alerts are delivered.
      Email__FromEmail: ${EMAIL_FROM:-}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: "${SMTP_PORT:-587}"
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__UseStartTls: "${SMTP_USE_STARTTLS:-true}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - vord-fleet

  web:
    image: ghcr.io/framlux/vord/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api-server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5254}:5254"
    environment:
      API_BASE_URL: http://api-server:12233
      PORT: "5254"
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5254/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - vord-fleet

volumes:
  pgdata:

networks:
  vord-fleet:
    driver: bridge
