        run: find test -type f -path '*/bin/Release/*' -exec chmod +x {} +

      # ubuntu-latest runners ship with Docker pre-installed and the daemon already running,
      # so Testcontainers.PostgreSql picks up the default Docker socket without extra config.
      - name: Run integration tests
        run: dotnet run --project test/integration/integration.csproj -c Release --no-build

  coverage:
    needs:
      - test-unit-services-core
      - test-unit-server
      - test-unit-database
      - test-functional-web
      - test-functional-grpc
      - test-functional-hangfire
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Download coverage from every suite
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage

      - name: Install report generator
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Merges every suite's report before measuring. Per-suite numbers understate badly — the
      # server assembly alone is exercised by four of them — so the gate is only meaningful on the
      # union.
      - name: Merge coverage and enforce the threshold
        run: ./scripts/check-coverage.sh coverage coverage-report

      - name: Upload the HTML coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-report
          path: coverage-report
          retention-days: 14
