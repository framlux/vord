name: CI • Build, Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A new push to a PR makes the in-flight run obsolete; cancel it rather than queueing behind it.
# Runs on main are never cancelled — those results gate the release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOLUTION: machine-info.slnx

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a  # v4.4.0
        with:
          version: 11.1.1

      - name: Build (Release)
        run: dotnet build "$SOLUTION" -c Release

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src/web

      - name: Build web
        run: pnpm build
        working-directory: src/web

      - name: Verify mock symbols are not in production bundle
        # Tree-shaking depends on dev resolving to a compile-time false constant in the
        # production bundle. If any module accidentally introduces a non-side-effect-free
        # reference to mock-fixtures, the mock data would ship to customers. Fail the build
        # hard in that case. Scans local build output only — no untrusted GH event input.
        run: |
          if grep -r 'MockApiClient' build/server build/client 2>/dev/null; then
            echo 'ERROR: MockApiClient symbol leaked into production bundle'
            exit 1
          fi
          if grep -r 'mock-fixtures' build/server build/client 2>/dev/null; then
            echo 'ERROR: mock-fixtures path leaked into production bundle'
            exit 1
          fi
        working-directory: src/web

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dotnet-build
          path: |
            src/*/bin/Release
            test/*/bin/Release
            test/*/*/bin/Release
          retention-days: 1

  # Go and web run as their own jobs rather than as steps inside `build`, for two reasons: they
  # need none of the .NET artifacts, so they start immediately instead of queueing; and a failure
  # in one language no longer hides every other suite behind a skipped `needs: build`.
  test-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: '1.26.x'

      - name: Check Go formatting
        working-directory: src/agent
        # gofmt -l prints the files that need formatting and exits 0 either way, so the file list
        # has to be turned into the failure signal explicitly.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error::These files are not gofmt-formatted. Run: gofmt -w ."
            echo "${unformatted}"
            exit 1
          fi
          echo "All Go files are gofmt-clean."

      - name: Build Go agent
        run: go build ./...
        working-directory: src/agent

      - name: Vet Go agent
        run: go vet ./...
        working-directory: src/agent

      - name: Test Go agent
        run: go test ./...
        working-directory: src/agent

      - name: Test agent installer
        run: bash deployment/agent/install_test.sh

      - name: Lint the installer
        # The installer runs unattended as root on customer machines, so a shellcheck warning
        # there is worth failing a PR over. This file is the canonical copy; anything that
        # re-serves it is responsible for diffing itself against this one.
        run: shellcheck --severity=warning deployment/agent/install.sh

  test-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a  # v4.4.0
        with:
          version: 11.1.1

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src/web

      - name: Sync SvelteKit generated types
        # svelte-check reads .svelte-kit/tsconfig.json, which only exists after a sync. The build
        # job gets it for free via `pnpm build` (svelte-kit sync && vite build); this job does not
        # build, so it has to sync explicitly or svelte-check fails on a missing tsconfig.
        run: pnpm exec svelte-kit sync
        working-directory: src/web

      - name: Type-check web (svelte-check)
        run: pnpm check
        working-directory: src/web

      - name: Run web unit tests (vitest)
        run: pnpm test
        working-directory: src/web

  test-unit-services-core:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dotnet-build

      - name: Restore the executable bit on test binaries
        # upload-artifact/download-artifact do not preserve file modes, so the apphost that
        # `dotnet run` execs comes back without +x and every test job dies with
        # "Permission denied". This had been failing CI since the artifact split was introduced.
        # Every file under the test output is chmod'ed rather than trying to single out the
        # apphost: the binaries are named after their project (unit.database, functional.grpc),
        # so no "extensionless" filter can find them, and a stray +x on a .dll or .json is
        # harmless on an ephemeral runner.
        run: find test -type f -path '*/bin/Release/*' -exec chmod +x {} +

      - name: Run unit tests (services.core)
        run: dotnet run --project test/unit/services.core/unit.services.core.csproj -c Release --no-build

      - name: Install coverage tools
        run: |
          dotnet tool install --global coverlet.console
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Collect coverage
        run: ./scripts/run-tests-with-coverage.sh test/unit/services.core/unit.services.core.csproj coverage/unit.services.core.xml

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-unit.services.core
          path: coverage/unit.services.core.xml
          retention-days: 1

