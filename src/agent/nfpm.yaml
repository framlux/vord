name: vord-agent
# PKG_ARCH is the nfpm architecture name, which is not always the Go one: GOARCH=arm must be
# packaged as arm7 so nfpm emits Debian's "armhf". Publishing it as "arm" produces an architecture
# no dpkg recognises, so apt on a 32-bit host requests dists/*/*/binary-armhf/Packages, gets a
# 404, and `apt-get update` fails before the agent can be installed at all.
arch: ${PKG_ARCH}
version: ${VERSION}
maintainer: Framlux <info@framlux.io>
description: Vord Agent - Machine telemetry collector and control plane agent
vendor: Framlux
homepage: https://github.com/framlux/vord
license: MIT

contents:
  - src: ./publish/vord-agent-linux-${BIN_ARCH}
    dst: /usr/local/bin/vord-agent
    file_info:
      mode: 0755

  - src: ./vord-agent.service
    dst: /usr/lib/systemd/system/vord-agent.service
    file_info:
      mode: 0644

  - dst: /etc/framlux
    type: dir
    file_info:
      mode: 0700

  - dst: /var/lib/vord-agent
    type: dir
    file_info:
      mode: 0700

scripts:
  postinstall: ./packaging/postinstall.sh
  preremove: ./packaging/preremove.sh
  postremove: ./packaging/postremove.sh

rpm:
  signature:
    # Path to the armoured private key, materialized from the RPM_SIGNING_KEY secret by the
    # release workflow. An empty value builds an unsigned package — which is the state the
    # published RPMs are in today, and why the installer must use repo_gpgcheck rather than
    # gpgcheck. Once the secret exists, packages sign automatically and the installer's yum block
    # can be restored to gpgcheck=1.
    key_file: ${RPM_SIGN_KEY_FILE}
